# The Mac App Store build. Generates Edwell.xcodeproj, which is committed because Xcode Cloud builds it:
#   cd App && xcodegen generate
# The app itself is the EddieKit library in the package one folder up; this target only wraps it.
name: Edwell
options:
  bundleIdPrefix: com.iamjarl
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.1"

packages:
  Eddie:
    path: ..
  # Anonymous crash reports (CrashReporter.swift). The app target links it, the package doesn't, so
  # `swift build` and the self test never fetch it. An exact version: the installation ID is pinned
  # through an SDK detail, which is checked again before every upgrade (XCODE_CLOUD.md).
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.33.0

targets:
  Edwell:
    type: application
    platform: macOS
    sources:
      - path: Edwell
      - path: ../Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Eddie
        product: EddieKit
      - package: Sentry
        product: Sentry
    info:
      path: Edwell/Info.plist
      properties:
        CFBundleDisplayName: Edwell
        # Must follow the build settings, or TestFlight uploads all claim 1.0 (1).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: "© 2026 IAMJARL"
        ITSAppUsesNonExemptEncryption: false
        # Where crash reports go. Never a DSN in git: it comes from the build (SENTRY_DSN below, or
        # Xcode Cloud's secret through ci_scripts/ci_pre_xcodebuild.sh). Empty means no reports.
        SentryDSN: "$(SENTRY_DSN)"
        # The project type and its extensions match Editor.projectType and Editor.projectExtensions.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.iamjarl.edwell.project
            UTTypeDescription: Edwell Project
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - edwell
                - eddie
        CFBundleDocumentTypes:
          - CFBundleTypeName: Edwell Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.iamjarl.edwell.project
    # Only what the app uses: files the user picks in an open or save panel or drags in, and outgoing
    # connections for the anonymous crash reports (Sentry, nothing else; StoreKit needs none).
    entitlements:
      path: Edwell/Edwell.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    # An archive without a DSN would ship with crash reports silently off. Xcode Cloud stops earlier
    # (ci_pre_xcodebuild.sh); this catches an archive made anywhere else. Archives only, never a build.
    postBuildScripts:
      - name: Check the Sentry DSN
        runOnlyWhenInstalling: true
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          dsn=$(/usr/libexec/PlistBuddy -c "Print :SentryDSN" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true)
          case "$dsn" in
            https://?*@?*/?*) echo "Sentry DSN present" ;;
            *) echo "error: This archive has no Sentry DSN, so it would ship without crash reports. Set SENTRY_DSN (XCODE_CLOUD.md)."; exit 1 ;;
          esac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamjarl.edwell
        PRODUCT_NAME: Edwell
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KDWZ3WNLDK
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        # Set on the command line (`SENTRY_DSN=… ./build.sh`, `xcodebuild … SENTRY_DSN=…`), never here.
        SENTRY_DSN: ""

  # The trial and the purchase against Edwell.storekit (StoreKitTest needs a test hosted in the app).
  EdwellStoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StoreTests
      - path: Edwell.storekit
        buildPhase: resources
    dependencies:
      - target: Edwell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.iamjarl.edwell.storetests
        SWIFT_VERSION: "5.0"

schemes:
  Edwell:
    build:
      targets:
        Edwell: all
    run:
      config: Debug
      # Purchases in an Xcode run go to this local configuration instead of the App Store.
      storeKitConfiguration: Edwell.storekit
    test:
      targets:
        - EdwellStoreTests
    archive:
      config: Release
